# EdgeShield ByteTrack settings for robust continuous tracking on indoor and outdoor surveillance feeds.
# Optimized match_thresh prevents track fragmentation when subjects move or change scale.
tracker_type: bytetrack
track_high_thresh: 0.20
track_low_thresh: 0.10
new_track_thresh: 0.20
track_buffer: 60
match_thresh: 0.75
fuse_score: true

